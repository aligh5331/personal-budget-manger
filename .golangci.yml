version: "2"

linters:
  enable:
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '^strings\.Split(N|After|AfterN|Seq|SeqN)?$'
          msg: callback_data goes through ParseCallbackData / BuildCallbackData (internal/bot/callbackdata.go); for other text, add //nolint:forbidigo with the reason
  exclusions:
    rules:
      - linters: [forbidigo]
        path-except: internal/bot/
      - linters: [forbidigo]
        path: internal/bot/callbackdata\.go
      - linters: [forbidigo]
        path: _test\.go

# gofmt drift fails `golangci-lint run`.
formatters:
  enable:
    - gofmt
